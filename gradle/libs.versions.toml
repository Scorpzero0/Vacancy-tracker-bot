[versions]
guava = "32.1.2-jre"
junit-jupiter = "5.10.0"
jackson = "2.18.2"
telegrambots = "8.0.0"
opencsv = "5.9"
junit = "5.10.0"
lombok = "1.18.34"
quartz = "2.5.0"
jacoco = "0.8.12"
mockito = "5.23.0"
logbackClassic = "1.5.38"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310", version.ref = "jackson" }
telegram-longpolling = { group = "org.telegram", name = "telegrambots-longpolling", version.ref = "telegrambots" }
telegram-client = { group = "org.telegram", name = "telegrambots-client", version.ref = "telegrambots" }
opencsv = { group = "com.opencsv", name = "opencsv", version.ref = "opencsv" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" } # Версия управляется через BOM, здесь она не нужна
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
quartz-scheduler = { group = "org.quartz-scheduler", name = "quartz", version.ref = "quartz" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logbackClassic" }